<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Ganita Ventures</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/img/logo.png" type="image/png">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="main-header">
    <div class="container header-container">
      <a href="/" class="brand-logo" title="Ganita Ventures Homepage">
        <img src="/assets/img/logo.png" alt="Ganita Ventures Logo" width="183" height="44">
      </a>
      <div class="header-actions">
        <a href="/" class="btn btn-primary btn-sm">Return Home</a>
      </div>
    </div>
  </header>

  <section class="section" style="text-align: center; padding: 6rem 1.5rem;">
    <div class="container" style="max-width: 600px;">
      <div style="font-size: 5rem; font-weight: 900; color: var(--primary); font-family: var(--font-heading);">404</div>
      <h1 style="font-size: 2rem; color: var(--secondary); margin-bottom: 1rem;">Page Not Found</h1>
      <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 1.05rem;">
        The page you are looking for does not exist or may have been moved.
      </p>
      <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="/" class="btn btn-primary">Go to Homepage</a>
        <a href="/products" class="btn btn-outline">Browse Products</a>
        <a href="/contact" class="btn btn-secondary">Contact Support</a>
      </div>
    </div>
  </section>

  <footer class="main-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 <strong>Ganita Ventures</strong>. All Rights Reserved.</div>
      </div>
    </div>
  </footer>
</body>
</html>
